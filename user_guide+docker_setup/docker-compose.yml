version: '3.8'

services:
  trellis:
    build: .
    container_name: trellis-blackwell
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,graphics
      - ATTN_BACKEND=xformers
      - SPCONV_ALGO=native
      - TORCH_CUDA_ARCH_LIST=12.0
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - HF_TOKEN=${HF_TOKEN:-}
    ports:
      - "7860:7860"
    volumes:
      - ./outputs:/app/TRELLIS/outputs
      - ./inputs:/app/TRELLIS/inputs
      - hf_cache:/root/.cache/huggingface
      - torch_cache:/root/.cache/torch
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    shm_size: '8g'
    restart: unless-stopped

volumes:
  hf_cache:
  torch_cache:
